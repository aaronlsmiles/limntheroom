<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e2e2de" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Limn the Room: ink that reads the room. A seam-view sketch on synthetic data, not results." />
    <title>Limn the Room (synthetic sketch)</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/sketch/seam.json" as="fetch" crossorigin />
    <script>
      try { const t = localStorage.getItem("ltr-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The seam view needs JavaScript to play the take and draw the overlay. This is a sketch on synthetic data.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
