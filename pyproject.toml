[project]
name = "limntheroom"
version = "0.0.1"
description = "Limn the Room: ink that reads the room"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "opencv-python==5.0.0.93",
  "scikit-image==0.26.0",
  "scipy==1.18.1",
  "av==19.0.2",
  "imageio==2.38.1",
  "mediapipe==1.2.0",
  "pyobjc-framework-Vision==13.0; sys_platform == 'darwin'",
  "Pillow==13.0.0",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "sam-2",
  "hydra-core==1.3.8",
  "iopath==0.1.10",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rehearsal: the end-to-end synthetic rehearsal (tools/rehearse.py; slow, SAM 2.1 on CPU); run it alone with -m rehearsal"]
addopts = "-m 'not rehearsal'"
